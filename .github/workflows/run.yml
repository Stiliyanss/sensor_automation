name: Run Sensor Processing

on:
  schedule:
    - cron: '0 6 * * *'  # Пуска се всеки ден в 06:00 сутрин (UTC)
  workflow_dispatch:      # Позволява ти да го пускаш и ръчно от бутона в GitHub

jobs:
  run-script:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Create service_account.json from Secret
        run: |
          echo "${{ secrets.GCP_SA_KEY }}" > service_account.json

      - name: Run script
        run: |
          python main.py