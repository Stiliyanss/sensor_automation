name: Run Sensor Processing

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

jobs:
  run-script:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install gspread pandas matplotlib

      - name: Create service_account.json from Secret
        run: |
          echo "${{ secrets.GCP_SA_KEY }}" > service_account.json

      - name: Run script
        run: |
          python main.py